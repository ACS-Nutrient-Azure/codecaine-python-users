version: "3.9"

services:
  frontend:
    build:
      context: ../source-frontend
      args:
        - VITE_COGNITO_USER_POOL_ID=${VITE_COGNITO_USER_POOL_ID:-ap-northeast-2_r254TEZGi}
        - VITE_COGNITO_CLIENT_ID=${VITE_COGNITO_CLIENT_ID:-5jc2e0ftplhoht8305bgs7t155}
    ports:
      - "5173:8080"
    depends_on:
      - mypage-service

  mypage-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - COGNITO_USER_POOL_ID=ap-northeast-2_r254TEZGi
      - COGNITO_CLIENT_ID=5jc2e0ftplhoht8305bgs7t155
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mypage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
