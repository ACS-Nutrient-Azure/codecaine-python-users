version: "3.9"

services:
  # 마이페이지 서비스
  mypage-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/mypage_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # 코드 변경 시 바로 반영 (개발용)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 로컬 PostgreSQL (RDS 대용)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mypage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
